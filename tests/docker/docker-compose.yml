services:
  target:
    # Official Docker image, no local build:
    #   https://github.com/docker-library/php  (tag 8.4.26-apache)
    # Apache prefork + mod_php, PHP 8.4.26 (the last vulnerable 8.4 patch).
    image: ${PHP_IMAGE:-php:8.4.26-apache}
    platform: linux/amd64
    container_name: php2shell-target
    # Host networking: the target answers on 127.0.0.1:8088 and the scanner's
    # script server on 127.0.0.1:<lport> is reachable from the target via
    # 0.0.0.0 (= loopback), which the 14-byte carrier budget requires.
    network_mode: host
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./ports.conf:/etc/apache2/ports.conf:ro
      - ./apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
    restart: unless-stopped
